name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  algorithm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: >
          python -m pip install
          -r structural-fem-lab/requirements.txt
          -r orbit-dynamics-lab/requirements.txt
          -r robot-motion-lab/requirements.txt
      - name: Structural FEM tests
        run: PYTHONPATH=structural-fem-lab python -m unittest discover -s structural-fem-lab/tests -v
      - name: Orbit dynamics tests
        run: PYTHONPATH=orbit-dynamics-lab python -m unittest discover -s orbit-dynamics-lab/tests -v
      - name: Robot motion tests
        run: PYTHONPATH=robot-motion-lab python -m unittest discover -s robot-motion-lab/tests -v
      - name: Generate structural example
        run: PYTHONPATH=structural-fem-lab python -m examples.space_truss
      - name: Generate orbit example
        run: PYTHONPATH=orbit-dynamics-lab python -m examples.leo_orbit
      - name: Generate robot example
        run: PYTHONPATH=robot-motion-lab python -m examples.planar_arm
